<script type="text/javascript">
  DoxygenAwesomeDarkModeToggle.init()
  DoxygenAwesomeInteractiveToc.init()
  DoxygenAwesomeFragmentCopyButton.init()

  $(document).ready(function() {
      // Custom logic to split "Classes" dropdown into "Python Classes" and "C++ Classes"
      let menuItems = $('#nav-tree .item');
      let classesItem = null;
      // We will look for this in menudata.js (when navtree is built) or inside the generated top menu
      if (typeof menudata !== "undefined") {
          for (let item of menudata.children) {
              if (item.text === "Classes") {
                  // Re-organize its children
                  item.children = [
                      {text: "Python Classes", url: "annotated.html#python"},
                      {text: "C++ Classes", url: "annotated.html#cpp"},
                      ...item.children
                  ];
              }
          }
      }
      
      // Also modify the actual DOM if using top menu
      let classTab = $('#main-nav > ul > li:has(a:contains("Classes")) > ul');
      if (classTab.length) {
          classTab.prepend('<li><a href="annotated.html#cpp">C++ Classes</a></li>');
          classTab.prepend('<li><a href="annotated.html#python">Python Classes</a></li>');
      }
  });
</script>
